[project]
name = "sightline"
version = "0.0.1"
description = "Didn't see it, or chose wrong? Splitting lost value into Vision Loss and Decision Loss with body pose + tracking."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "mplsoccer>=1.2",
    "kloppy>=3.15",
    "ijson>=3.2",
    "pyyaml>=6",
    "orjson>=3.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
